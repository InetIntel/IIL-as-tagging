name: CI

# Smoke-tests the `[ml]` extra (XGBoost / MLP / semi-supervised PUN) on synthetic
# data so a broken ML path is caught on every push to main and every PR. Does not
# gate releases -- publishing is driven by v*.*.* tags in publish-pypi.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  ml-smoke:
    name: "[ml] smoke test (py3.13)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # skip the ~360 MB data/ directory -- the smoke test uses synthetic data
          sparse-checkout: |
            toolkit
            .github
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install as-tagging[ml]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
      - name: ML smoke test
        run: python .github/scripts/ml_smoke.py

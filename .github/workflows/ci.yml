name: CI

# Smoke-tests the `[ml]` extra (XGBoost / MLP / semi-supervised PUN) on synthetic
# data so a broken ML path is caught on every push to main and every PR. The
# publish workflow separately reruns the core tests against the built wheel.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  core-tests:
    name: "core tests (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            toolkit
            tests
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run core tests
        run: python -m pytest -q

  ml-smoke:
    name: "[ml] smoke test (py3.13)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # skip the ~360 MB data/ directory -- the smoke test uses synthetic data
          sparse-checkout: |
            toolkit
            .github
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install as-tagging[ml]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
      - name: ML smoke test
        run: python .github/scripts/ml_smoke.py
